org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Target game version. This mod runs ON 1.21.4 (protocol 769).
minecraft_version=1.21.4
loader_version=0.16.9
fabric_version=0.114.0+1.21.4

mod_version=1.0.0
maven_group=dev.viabridge
archives_base_name=viabridge

# Translation libraries, bundled into the output jar (jar-in-jar).
#   viaversion   - core protocol framework + newer-client-to-older-server protocols
#   viabackwards - older-client-to-newer-server protocols (this is the one that
#                  actually carries 1.21.11 -> 1.21.4)
# Bump both together; they must always be the same release line.
viaversion_version=5.11.+
viabackwards_version=5.11.+
