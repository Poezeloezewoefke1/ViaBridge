name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed only for the release step on tag builds; branch builds do not use it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      # Compiling proves the sources are valid. It does not prove the Via libraries were
      # bundled into the jar, which is what makes the mod self-contained — so assert it
      # here rather than just printing it, and fail the build if it regresses.
      - name: Verify jar contents
        id: verify
        run: |
          set -euo pipefail
          jar=$(ls build/libs/viabridge-*.jar | grep -v sources | head -1)
          nested=$(unzip -l "$jar" | grep -oE "META-INF/jars/[^[:space:]]+\.jar" || true)

          echo "$nested"
          echo "$nested" | grep -q viaversion   || { echo "::error::viaversion was not nested into the jar";   exit 1; }
          echo "$nested" | grep -q viabackwards || { echo "::error::viabackwards was not nested into the jar"; exit 1; }

          # Both nested jars declare a dependency on a mod called 'viafabric'; without
          # this they are refused by the loader at runtime.
          unzip -p "$jar" fabric.mod.json | grep -q '"viafabric"' \
            || { echo "::error::fabric.mod.json is missing provides: viafabric"; exit 1; }

          classes=$(unzip -l "$jar" | grep -cE "dev/viabridge/.+\.class")
          [ "$classes" -ge 10 ] || { echo "::error::only $classes mod classes in the jar"; exit 1; }

          via=$(echo "$nested" | grep -oE "viaversion-[0-9][^/]*\.jar$" \
                | sed 's/viaversion-//; s/\.jar//' | head -1)
          echo "viaversion=$via" >> "$GITHUB_OUTPUT"

          {
            echo "### Jar verified"
            echo ""
            echo "\`$classes\` mod classes, nested libraries:"
            echo '```'
            echo "$nested"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The resolved Via version is carried in the artifact name so it is visible without
      # digging through logs.
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: viabridge-via${{ steps.verify.outputs.viaversion }}
          path: build/libs/*.jar
          if-no-files-found: error

      # Tag builds also publish a release. Marked as a prerelease: the jar is verified to
      # compile and package correctly, but has not been played against a live server.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          jar=$(ls build/libs/viabridge-*.jar | grep -v sources | head -1)

          notes=$(cat <<EOF
          Client-side Fabric mod for **Minecraft 1.21.4** that lets you join **1.21.11**
          servers. Nothing is installed server-side.

          Install \`$(basename "$jar")\` alongside [Fabric API](https://modrinth.com/mod/fabric-api).
          ViaVersion and ViaBackwards ${{ steps.verify.outputs.viaversion }} are bundled
          inside the jar — no separate download.

          On first launch, look for a \`ViaBridge ready\` line in the log to confirm the
          translation layer came up. Settings live in
          \`config/viabridge/viabridge.properties\`; it targets 1.21.11 by default and
          auto-detects other server versions.

          **Not yet played against a live server.** CI verifies that it compiles against
          1.21.4, that the mixin resolves, and that the Via libraries are bundled — it does
          not verify a real session, hence the prerelease flag.

          Content added after 1.21.4 is approximated or substituted, since a 1.21.4 client
          has no way to render it. Some servers and anti-cheats may still reject a
          translated connection.
          EOF
          )

          gh release create "$TAG" "$jar" \
            --title "ViaBridge $TAG" \
            --notes "$notes" \
            --prerelease
