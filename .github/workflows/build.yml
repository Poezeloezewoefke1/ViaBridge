name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      # Proves the two things that cannot be checked by compiling alone: that the Via
      # libraries were actually nested into the jar, and which versions resolved.
      - name: Verify jar contents
        run: |
          jar=$(ls build/libs/viabridge-*.jar | grep -v sources | head -1)
          echo "=== $jar"
          echo "--- nested jars (jar-in-jar):"
          unzip -l "$jar" | grep -E "META-INF/jars/.+\.jar" || echo "NONE FOUND"
          echo "--- our classes:"
          unzip -l "$jar" | grep -cE "dev/viabridge/.+\.class" | xargs echo "class count:"
          echo "--- fabric.mod.json:"
          unzip -p "$jar" fabric.mod.json

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: viabridge
          path: build/libs/*.jar
          if-no-files-found: error
