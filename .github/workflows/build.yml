name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core
        run: ./gradlew -PcoreOnly :core:test

  fabric:
    name: Minecraft ${{ matrix.mc }}
    needs: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.11"
            gametest: true
          - mc: "1.21.4"
            gametest: true
          # Fabric's client game test API only exists from 1.21.4 on; older versions
          # are compiled and their jars checked, but not started in CI.
          - mc: "1.21.1"
            gametest: false
          - mc: "1.20.1"
            gametest: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: ./gradlew -Pmc=${{ matrix.mc }} :fabric-${{ matrix.mc }}:build

      - name: Check jar contents
        run: |
          set -euo pipefail
          jar=$(ls fabric/${{ matrix.mc }}/build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "jar=$jar"
          unzip -l "$jar" | grep -q 'fabric.mod.json'                                || { echo "::error::fabric.mod.json missing"; exit 1; }
          unzip -l "$jar" | grep -q 'dev/texturemixer/core/pack/PackScanner.class'     || { echo "::error::core classes missing"; exit 1; }
          unzip -l "$jar" | grep -q 'dev/texturemixer/fabric/compat/VersionCompat.class' || { echo "::error::compat classes missing"; exit 1; }
          unzip -l "$jar" | grep -q 'assets/texturemixer/lang/en_us.json'               || { echo "::error::translations missing"; exit 1; }
          unzip -p "$jar" fabric.mod.json

      - name: Install virtual display
        if: matrix.gametest
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri imagemagick

      - name: Run in-game tests
        if: matrix.gametest
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -Pmc=${{ matrix.mc }} :fabric-${{ matrix.mc }}:runClientGameTest

      # Screenshots are also printed (small JPEGs, base64) so they can be checked from the log.
      - name: Print game test screenshots
        if: always() && matrix.gametest
        continue-on-error: true
        run: |
          dir=fabric/${{ matrix.mc }}/build/run/clientGameTest/screenshots
          [ -d "$dir" ] || exit 0
          for f in "$dir"/*mixer-screen*.png "$dir"/*pack-screen-after*.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 800x -quality 40 /tmp/shot.jpg
            echo "BEGIN_SHOT $(basename "$f")"
            base64 -w 4000 /tmp/shot.jpg
            echo "END_SHOT"
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: texture-mixer-mc${{ matrix.mc }}
          path: |
            fabric/${{ matrix.mc }}/build/libs/*.jar
            !fabric/${{ matrix.mc }}/build/libs/*-sources.jar

      - name: Upload game test screenshots and logs
        if: always() && matrix.gametest
        uses: actions/upload-artifact@v4
        with:
          name: gametest-mc${{ matrix.mc }}
          path: |
            fabric/${{ matrix.mc }}/build/run/clientGameTest/screenshots/
            fabric/${{ matrix.mc }}/build/run/clientGameTest/logs/latest.log
          if-no-files-found: ignore

      - name: Show published Fabric versions for this Minecraft version
        if: always()
        run: |
          mc="${{ matrix.mc }}"
          echo "fabric-api: $(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oE "<version>[^<]*\+$mc</version>" | sed 's/<[^>]*>//g' | tail -3 | tr '\n' ' ')"
          echo "yarn: $(curl -s https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml | grep -oE "<version>$mc\+build\.[0-9]+</version>" | sed 's/<[^>]*>//g' | tail -2 | tr '\n' ' ')"
          echo "loader: $(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -oE '<release>[^<]*' | sed 's/<release>//')"
          echo "loom: $(curl -s https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml | grep -oE '<version>1\.[0-9]+-SNAPSHOT</version>' | sed 's/<[^>]*>//g' | tail -3 | tr '\n' ' ')"

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: fabric
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: texture-mixer-mc*
          path: jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
