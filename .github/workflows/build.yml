name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core
        run: ./gradlew -PcoreOnly :core:test --stacktrace

  fabric:
    name: Minecraft ${{ matrix.mc }}
    needs: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.4"
            gametest: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: ./gradlew -Pmc=${{ matrix.mc }} :fabric-${{ matrix.mc }}:build --stacktrace

      - name: Check jar contents
        run: |
          set -euo pipefail
          jar=$(ls fabric/${{ matrix.mc }}/build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "jar=$jar"
          unzip -l "$jar" | grep -q 'fabric.mod.json'                                || { echo "::error::fabric.mod.json missing"; exit 1; }
          unzip -l "$jar" | grep -q 'dev/texturemixer/core/pack/PackScanner.class'     || { echo "::error::core classes missing"; exit 1; }
          unzip -l "$jar" | grep -q 'dev/texturemixer/fabric/compat/VersionCompat.class' || { echo "::error::compat classes missing"; exit 1; }
          unzip -l "$jar" | grep -q 'assets/texturemixer/lang/en_us.json'               || { echo "::error::translations missing"; exit 1; }
          unzip -p "$jar" fabric.mod.json

      - name: Install virtual display
        if: matrix.gametest
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Run in-game tests
        if: matrix.gametest
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -Pmc=${{ matrix.mc }} :fabric-${{ matrix.mc }}:runClientGameTest --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: texture-mixer-mc${{ matrix.mc }}
          path: |
            fabric/${{ matrix.mc }}/build/libs/*.jar
            !fabric/${{ matrix.mc }}/build/libs/*-sources.jar

      - name: Upload game test screenshots and logs
        if: always() && matrix.gametest
        uses: actions/upload-artifact@v4
        with:
          name: gametest-mc${{ matrix.mc }}
          path: |
            fabric/${{ matrix.mc }}/build/run/clientGameTest/screenshots/
            fabric/${{ matrix.mc }}/build/run/clientGameTest/logs/latest.log
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: fabric
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: texture-mixer-mc*
          path: jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
